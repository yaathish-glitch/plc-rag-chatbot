<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PLC RAG Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }
    .app { max-width: 960px; width: 100%; padding: 16px; }
    .card {
      background: #020617;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span.logo {
      background: #22c55e;
      color: #022c22;
      border-radius: 999px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    p.subtitle { margin-top: 4px; color: #9ca3af; font-size: 0.9rem; }

    .section {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #111827;
    }
    .section-title {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }

    input[type="file"], input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      margin-top: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #14b8a6);
      color: #022c22;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .status { font-size: 0.8rem; color: #a5b4fc; margin-top: 4px; }

    .row { display: flex; gap: 12px; margin-top: 12px; }
    .row > * { flex: 1; }

    .answer-box {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #111827;
      padding: 10px 12px;
      min-height: 80px;
      white-space: pre-wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #1f2937;
      background: #030712;
      color: #9ca3af;
    }
    .badge-ready { color: #4ade80; }
    .badge-loading { color: #eab308; }
    .badge-error { color: #f87171; }

    .debug-context {
      font-size: 0.8rem;
      color: #9ca3af;
      background: #020617;
      border: 1px dashed #1f2937;
      border-radius: 10px;
      padding: 8px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>

  <!-- pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.js"></script>

  <!-- transformers.js -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.9.0"></script>
</head>

<body>
<div class="app">
  <div class="card">
    <h1><span class="logo">PLC</span> PLC RAG Chatbot</h1>
    <p class="subtitle">
      Upload your PLC PDFs. The bot answers ONLY from the uploaded documents.
    </p>

    <!-- MODEL STATUS -->
    <div class="section">
      <div class="section-title">Model Status</div>
      <div class="status" id="model-status">Loading models…</div>
      <div class="pill" id="badge-emb">Embeddings: <span class="badge-loading">loading…</span></div>
      <div class="pill" id="badge-llm">LLM: <span class="badge-loading">loading…</span></div>
    </div>

    <!-- PDF UPLOAD -->
    <div class="section">
      <div class="section-title">1. Upload PLC PDFs</div>
      <input type="file" id="pdf-input" accept="application/pdf" multiple />
      <button id="btn-process-pdfs" disabled>Process PDFs & Build Knowledge Base</button>
      <div class="status" id="pdf-status"></div>
    </div>

    <!-- ASK -->
    <div class="section">
      <div class="section-title">2. Ask a Question</div>
      <input type="text" id="question-input" placeholder="e.g., What is a NO contact?" />
      <button id="btn-ask" disabled>Ask</button>
      <div class="status" id="qa-status"></div>

      <div class="answer-box" id="answer-box"></div>
    </div>

    <!-- CONTEXT -->
    <div class="section">
      <div class="section-title">Retrieved Context</div>
      <div class="debug-context" id="context-box">No context yet.</div>
    </div>
  </div>
</div>

<script>
  const { pipeline } = window.transformers;

  let embeddingPipeline = null;
  let generatorPipeline = null;
  const vectorDB = [];

  const modelStatusEl = document.getElementById("model-status");
  const badgeEmb = document.getElementById("badge-emb");
  const badgeLLM = document.getElementById("badge-llm");
  const btnProcessPDFs = document.getElementById("btn-process-pdfs");
  const btnAsk = document.getElementById("btn-ask");
  const pdfInput = document.getElementById("pdf-input");
  const pdfStatusEl = document.getElementById("pdf-status");
  const qaStatusEl = document.getElementById("qa-status");
  const questionInput = document.getElementById("question-input");
  const answerBox = document.getElementById("answer-box");
  const contextBox = document.getElementById("context-box");

  function cosineSimilarity(a, b) {
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      na += a[i] * a[i];
      nb += b[i] * b[i];
    }
    return dot / (Math.sqrt(na) * Math.sqrt(nb) + 1e-8);
  }

  function chunkText(text, size = 500, overlap = 100) {
    const sents = text.split(/(?<=[.?!])\s+|\n+/);
    const chunks = [];
    let cur = "";

    for (const s of sents) {
      if ((cur + " " + s).length > size) {
        if (cur.trim()) chunks.push(cur.trim());
        cur = cur.slice(-overlap) + " " + s;
      } else cur += " " + s;
    }
    if (cur.trim()) chunks.push(cur.trim());
    return chunks;
  }

  async function initModels() {
    try {
      modelStatusEl.textContent = "Loading Embedding Model…";

      embeddingPipeline = await pipeline(
        "feature-extraction",
        "Xenova/all-MiniLM-L6-v2"
      );

      badgeEmb.innerHTML = "Embeddings: <span class='badge-ready'>ready</span>";

      modelStatusEl.textContent = "Loading LLM (TinyLlama)…";

      generatorPipeline = await pipeline(
        "text-generation",
        "Xenova/tiny-llama-1.1b-chat"
      );

      badgeLLM.innerHTML = "LLM: <span class='badge-ready'>ready</span>";
      modelStatusEl.textContent = "Models ready. Upload PDFs.";

      btnProcessPDFs.disabled = false;
    } catch (err) {
      console.error(err);
      modelStatusEl.textContent = "Error loading models.";
    }
  }

  initModels();

  async function extractPDFText(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const ct = await pg.getTextContent();
      text += ct.items.map(t => t.str).join(" ") + "\n";
    }
    return text;
  }

  async function processPDFs(files) {
    vectorDB.length = 0;
    pdfStatusEl.textContent = "Extracting…";

    for (const f of files) {
      const raw = await extractPDFText(f);
      const cleaned = raw.replace(/\s+/g, " ").trim();
      const chunks = chunkText(cleaned);

      pdfStatusEl.textContent = `Processing ${f.name} (${chunks.length} chunks)…`;

      for (const ch of chunks) {
        const emb = await embeddingPipeline(ch, { pooling: "mean", normalize: true });
        const arr = emb.data || emb[0];
        vectorDB.push({
          embedding: new Float32Array(Array.from(arr)),
          text: ch,
          source: f.name
        });
      }
    }

    pdfStatusEl.textContent = "Knowledge base ready.";
    btnAsk.disabled = false;
  }

  function topK(queryEmb, k = 3) {
    const scores = vectorDB.map((item, idx) => ({
      idx,
      score: cosineSimilarity(queryEmb, item.embedding)
    }));
    scores.sort((a, b) => b.score - a.score);
    return scores.slice(0, k).map(s => vectorDB[s.idx]);
  }

  async function answerQuestion(q) {
    qaStatusEl.textContent = "Retrieving context…";

    const qEmb = await embeddingPipeline(q, { pooling: "mean", normalize: true });
    const qArr = qEmb.data || qEmb[0];
    const qVec = new Float32Array(Array.from(qArr));

    const chunks = topK(qVec);
    contextBox.textContent = chunks.map((c, i) =>
      `#${i+1} [${c.source}]\n${c.text}\n`
    ).join("\n");

    const ctx = chunks.map(c => `From ${c.source}: ${c.text}`).join("\n");

    const prompt = `
You are a PLC assistant. Answer ONLY using this context.
If not found, reply EXACTLY: "Information not found in the provided PLC documents."

Context:
${ctx}

Question: ${q}

Answer:
`.trim();

    qaStatusEl.textContent = "Generating answer…";

    const out = await generatorPipeline(prompt, {
      max_new_tokens: 200,
      temperature: 0.2
    });

    const text = out[0].generated_text.split("Answer:").slice(-1)[0].trim();
    answerBox.textContent = text;
    qaStatusEl.textContent = "";
  }

  btnProcessPDFs.onclick = async () => {
    btnProcessPDFs.disabled = true;
    pdfStatusEl.textContent = "Processing PDFs…";
    await processPDFs(pdfInput.files);
    btnProcessPDFs.disabled = false;
  };

  btnAsk.onclick = async () => {
    const q = questionInput.value.trim();
    if (!q) return;
    btnAsk.disabled = true;
    await answerQuestion(q);
    btnAsk.disabled = false;
  };
</script>

</body>
</html>
